name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    steps:
      - uses: actions/checkout@v7
      - name: Build, test, and reproduce legacy and shadow vectors
        env:
          CC: ${{ matrix.cc }}
        run: make CFLAGS='-O2 -std=c11 -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Werror' shadow-ci

  sanitizers:
    name: ubuntu / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run sanitizer suite
        run: make CC=clang sanitize && make CC=clang sanitize-shadow

  windows:
    name: windows / UCRT64 GCC
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
      - name: Build, test, and reproduce legacy and shadow vectors
        run: make CC=gcc PYTHON=python CFLAGS='-O2 -std=c11 -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Werror' shadow-ci
